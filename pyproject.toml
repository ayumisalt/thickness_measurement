[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thickness-measurement"
version = "1.0.0"
description = "Microscope track-thickness and volume-range analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["thickness_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
